name: grammar-and-zed
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tree-sitter generate --abi 14
      - run: npx tree-sitter test
      - run: node --test zed-qsl/server/test.js
      - run: rustup target add wasm32-wasip2
      - run: cargo build --manifest-path zed-qsl/Cargo.toml --target wasm32-wasip2 --release --locked
